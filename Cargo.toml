[package]
name = "JekisBackend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.0-rc.1"
tokio = { version = "1.42.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"]}
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio-native-tls", "uuid", "derive", "chrono"]}
dotenv = "0.15"
chrono = { version = "0.4.41", features = ["serde"] }
async-trait = "0.1.89"
serde_json = "1.0.142"
validator = { version = "0.20.0", features = ["derive"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
bcrypt = "0.17.1"
