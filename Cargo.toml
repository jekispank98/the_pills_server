[package]
name = "JekisBackend"
version = "0.1.0"
edition = "2024"

# Явное имя lib-таргета — main.rs и integration-тесты в tests/ оба используют
# этот крейт (`use pills_server_test::...`) вместо дублирования `mod` в каждом
# бинарном/тестовом корне.
[lib]
name = "pills_server_test"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1.42.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"
validator = { version = "0.20.0", features = ["derive"] }

sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio-native-tls", "derive", "chrono", "uuid"] }
chrono = { version = "0.4.41", features = ["serde"] }
async-trait = "0.1.89"
# "serde" — users.id/persons.id are Uuid and go straight into JSON DTOs.
uuid = { version = "1.18.0", features = ["v4", "serde"] }

# Пароли: argon2 — для новых хешей, bcrypt — только для проверки исторических.
argon2 = "0.5.1"
bcrypt = "0.17.1"
jsonwebtoken = "9.3.1"
time = "0.3.20"

lettre = { version = "0.11.18", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
] }
reqwest = { version = "0.12", features = ["json"] }
moka = { version = "0.12", features = ["future"] }

dotenv = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
